<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <g transform="translate(150,100)">
    <rect x="0" y="0" width="300" height="200" rx="16" fill="#0f172a"/>
    <circle cx="20" cy="20" r="6" fill="#ef4444"/>
    <circle cx="40" cy="20" r="6" fill="#fbbf24"/>
    <circle cx="60" cy="20" r="6" fill="#10b981"/>
    <text x="20" y="60" font-family="JetBrains Mono,monospace" font-size="14" fill="#10b981">$ hello.py</text>
    <text x="20" y="90" font-family="JetBrains Mono,monospace" font-size="14" fill="#06b6d4">&gt; print("Hello!")</text>
    <text x="20" y="120" font-family="JetBrains Mono,monospace" font-size="14" fill="#fff">Hello!</text>
    <text x="20" y="150" font-family="JetBrains Mono,monospace" font-size="14" fill="#10b981">_</text>
  </g>
  <text x="300" y="370" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="28" font-weight="900" fill="#fff">CODING BASICS</text>
</svg>
